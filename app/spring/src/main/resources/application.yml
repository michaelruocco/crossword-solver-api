spring:
  servlet:
    multipart:
      max-file-size: 17MB
      max-request-size: 17MB
  datasource:
    url: jdbc:postgresql://localhost:5433/crossword-solver-db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

bedrock:
  client:
    region: eu-west-1
    connectionTimeout: 30s
    socketTimeout: 180s
    apiCallAttemptTimeout: 2m
    apiCallTimeout: 4m
  conversation:
    temperature: 0.2
    maxTokens: 2024
  model:
    answerFinder: eu.anthropic.claude-opus-4-6-v1
    clueExtractor: eu.anthropic.claude-opus-4-6-v1
    clueRanker: eu.anthropic.claude-opus-4-6-v1
    clueTypePolicy: eu.anthropic.claude-sonnet-4-6

hackathon.base-url: https://hackathon.caci.co.uk/api

management.endpoints.web.exposure.include: health,info